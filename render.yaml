# CodSign: free hosting on Render (Blueprint).
# Render > New > Blueprint > pick this repo. It asks only for the values marked `sync: false`.
services:
  - type: web
    name: codsign
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Generated by Render, never stored in the repo
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXT_PRIVATE_ENCRYPTION_KEY
        generateValue: true
      - key: NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY
        generateValue: true
      # Neon connection string (paste in Render)
      - key: NEXT_PRIVATE_DATABASE_URL
        sync: false
      # Email via a dedicated Gmail account + app password (paste in Render)
      - key: NEXT_PRIVATE_SMTP_USERNAME
        sync: false
      - key: NEXT_PRIVATE_SMTP_PASSWORD
        sync: false
      - key: NEXT_PRIVATE_SMTP_TRANSPORT
        value: smtp-auth
      - key: NEXT_PRIVATE_SMTP_HOST
        value: smtp.gmail.com
      - key: NEXT_PRIVATE_SMTP_PORT
        value: "465"
      - key: NEXT_PRIVATE_SMTP_SECURE
        value: "true"
      - key: NEXT_PRIVATE_SMTP_FROM_NAME
        value: CodSign
      # Seal certificate (.p12 as base64, no passphrase) (paste in Render)
      - key: NEXT_PRIVATE_SIGNING_LOCAL_FILE_CONTENTS
        sync: false
      - key: NEXT_PRIVATE_SIGNING_TRANSPORT
        value: local
      - key: NEXT_PRIVATE_SIGNING_TIMESTAMP_AUTHORITY
        value: http://timestamp.digicert.com
      - key: NEXT_PUBLIC_UPLOAD_TRANSPORT
        value: database
      # Free plan has 512 MB RAM
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
