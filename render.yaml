# CodSign: free hosting on Render (Blueprint).
# Render > New > Blueprint > pick this repo. It asks only for the values marked `sync: false`.
services:
  - type: web
    name: codsign
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Generated by Render, never stored in the repo
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXT_PRIVATE_ENCRYPTION_KEY
        generateValue: true
      - key: NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY
        generateValue: true
      # Neon connection string (paste in Render)
      - key: NEXT_PRIVATE_DATABASE_URL
        sync: false
      # Email via Resend HTTPS API (Render free blocks SMTP ports). Domain verified in Resend.
      - key: NEXT_PRIVATE_SMTP_TRANSPORT
        value: resend
      - key: NEXT_PRIVATE_RESEND_API_KEY
        sync: false
      - key: NEXT_PRIVATE_SMTP_FROM_NAME
        value: CodSign
      - key: NEXT_PRIVATE_SMTP_FROM_ADDRESS
        value: noreply@codsign.app
      # Seal certificate (.p12 as base64, no passphrase) (paste in Render)
      - key: NEXT_PRIVATE_SIGNING_LOCAL_FILE_CONTENTS
        sync: false
      - key: NEXT_PRIVATE_SIGNING_TRANSPORT
        value: local
      - key: NEXT_PRIVATE_SIGNING_TIMESTAMP_AUTHORITY
        value: http://timestamp.digicert.com
      - key: NEXT_PUBLIC_UPLOAD_TRANSPORT
        value: database
      # Invite-only: no public signup. People use /request-access and admins get an email.
      - key: NEXT_PUBLIC_DISABLE_SIGNUP
        value: "true"
      # Free plan has 512 MB RAM. Render has no IPv6 egress, so prefer IPv4 (Gmail SMTP failed with ENETUNREACH)
      - key: NODE_OPTIONS
        value: --max-old-space-size=384 --dns-result-order=ipv4first
